services:
  sample-flask:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "5000:5000"          # сохраняем порт после мерджа
    volumes:
      - ..:/code:delegated   # live-маунт исходников
    command: ["python", "./app.py"]   # без OTel, чтобы исключить внешние сервисы
    environment:
      MONGO_URI: mongodb://root:examplepwd@mongodb:27017
