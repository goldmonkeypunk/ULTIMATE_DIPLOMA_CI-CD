services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepwd
    ports:
      - "27017:27017"

  sample-flask:
    image: signoz/sample-flask-app:latest   # будет переопределён в dev‑container
    container_name: sample-flask
    ports:
      - "5000:5000"                         # единый порт внутри и снаружи
    extra_hosts:
      - signoz:host-gateway                 # оставляем как в оригинале
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://root:examplepwd@mongodb:27017
      OTEL_RESOURCE_ATTRIBUTES: service.name=sample-flask
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz:4317
